<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expo PyME · Encuesta + Ruleta</title>
<style>
/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#1b1e23;background:#f3eff0;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
/* Paleta de marca Expo PyME (rojo / vino) */
:root{
  --brand:#8c1d40;        /* vino/maroon (EXPO) */
  --brand-2:#e11b22;      /* rojo (PyME) */
  --brand-strong:#a3234c; /* hover */
  --brand-deep:#6e1732;   /* sombra profunda */
  --brand-soft:#faf1f4;   /* relleno suave seleccionado */
  --brand-line:#eecdd8;   /* borde suave */
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.hidden{display:none !important}
.app{min-height:100%;display:flex;flex-direction:column}

/* ============================================================
   ESTILO CLARO / MINIMALISTA  (encuesta + admin)
   Paleta neutra fría, tipografía fina y mucho aire.
   Inspirado en la referencia "Tecnología & Seguridad".
   ============================================================ */
.min{max-width:900px;margin:0 auto;width:100%;padding:64px 20px 120px}

/* Progreso */
.progress{max-width:720px;margin:6px auto 30px;height:4px;background:#e6dde1;border-radius:99px;overflow:hidden}
.progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));width:0;transition:width .4s ease}

/* Tarjeta */
.card{background:#fff;border:1px solid #e6e9ed;border-radius:22px;padding:38px 34px;box-shadow:0 12px 40px rgba(27,30,35,.06);max-width:720px;margin:0 auto}
.step-tag{font-size:11px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#9aa1a9;margin:0 0 12px}
.q{font-size:24px;font-weight:500;margin:0 0 6px;color:#1b1e23;letter-spacing:-.015em;line-height:1.25}
.q.sm{font-size:18px;margin-top:34px}
.hint{color:#868d95;font-size:14px;margin:0 0 22px}

.field{margin:0 0 18px}
.field label{display:block;font-size:12px;font-weight:600;color:#63696f;margin:0 0 7px;letter-spacing:.04em}
.field .opt{color:#a9afb6;font-weight:400}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=number],.field select,.field textarea{
  width:100%;padding:13px 15px;border:1px solid #e0e4e9;border-radius:13px;background:#f7f8fa;color:#1b1e23;outline:none;transition:border .15s,box-shadow .15s,background .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(140,29,64,.12)}
.field textarea{min-height:92px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* Escala de botones 0-10 / 1-10 */
.scale{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.scale button{
  min-width:46px;height:46px;padding:0 6px;border:1px solid #e2e6ea;background:#f7f8fa;border-radius:12px;
  font-weight:600;color:#5a6067;font-size:15px;transition:.12s;
}
.scale button:hover{border-color:#d3a9b7;background:#fff}
.scale button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(140,29,64,.28)}
.scale-ends{display:flex;justify-content:space-between;font-size:11px;color:#a9afb6;margin-top:6px;letter-spacing:.04em}

/* Opciones tipo radio / checkbox */
.choices{display:flex;flex-direction:column;gap:10px;margin:4px 0 4px}
.opt-row{
  display:flex;align-items:center;gap:14px;border:1px solid #e4e8ec;border-radius:14px;padding:15px 16px;background:#f7f8fa;
  cursor:pointer;transition:.12s;user-select:none;
}
.opt-row:hover{border-color:#d3a9b7;background:#fff}
.opt-row.on{border-color:var(--brand);background:var(--brand-soft)}
.opt-row .box{
  width:20px;height:20px;flex:0 0 auto;border:2px solid #ccd2d8;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.12s;
}
.opt-row.check .box{border-radius:6px}
.opt-row.on .box{border-color:var(--brand);background:var(--brand)}
.opt-row.on .box::after{content:"";width:8px;height:8px;background:#fff;border-radius:inherit}
.opt-row span{font-size:15px;color:#33383e;font-weight:400}

.rating-row{display:flex;flex-direction:column;gap:8px;padding:18px 0;border-top:1px solid #eef0f3}
.rating-row:first-of-type{border-top:none}
.rating-row .rlabel{font-weight:500;font-size:15px;color:#33383e}

.emp-block{border:1px solid #e6e9ed;border-radius:16px;padding:18px;margin-bottom:14px;background:#f7f8fa}
.emp-block h4{margin:0 0 12px;font-size:11px;color:#9aa1a9;font-weight:600;letter-spacing:.16em;text-transform:uppercase}

.nav{display:flex;gap:12px;margin-top:32px}
.btn{
  border:none;border-radius:999px;padding:15px 28px;font-weight:600;font-size:15px;letter-spacing:.01em;transition:.15s;
}
.btn-primary{background:var(--brand);color:#fff;flex:1;box-shadow:0 8px 22px rgba(140,29,64,.28)}
.btn-primary:hover{background:var(--brand-strong)}
.btn-ghost{background:#fff;color:#5a6067;border:1px solid #e0e4e9}
.btn-ghost:hover{border-color:#bfc5cc}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

/* Botón de configuración (engrane) — minimalista */
.cog{position:fixed;top:16px;right:16px;z-index:55;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:.15s}
.cog:hover{background:rgba(255,255,255,.24)}
.cog.dark{border-color:#e6d3da;background:rgba(255,255,255,.9);color:#a98896}
.cog.dark:hover{color:var(--brand);border-color:#d3a9b7}

/* ============================================================
   HERO A PANTALLA COMPLETA (bienvenida) — "card de foto"
   ============================================================ */
.hero-full{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;overflow:hidden;background:#6e1732}
.hero-full .photo{position:absolute;inset:0;
  background:
    radial-gradient(120% 95% at 82% 18%, #e11b22 0%, transparent 46%),
    radial-gradient(90% 90% at 12% 92%, #5a1128 0%, transparent 55%),
    linear-gradient(125deg,#8c1d40 0%,#6e1732 52%,#b0182a 100%);
}
.hero-full .photo::after{content:"";position:absolute;inset:0;
  background:radial-gradient(130% 120% at 50% 44%,transparent 44%,rgba(60,8,24,.55) 100%);}
/* Hexágonos decorativos (motivo Expo PyME) */
.hexes{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.hx{position:absolute;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.brand-logo{position:absolute;top:22px;left:26px;z-index:2;display:block;height:128px;width:auto;max-width:min(440px,82vw);object-fit:contain;filter:drop-shadow(0 4px 18px rgba(0,0,0,.35))}
.hero-full .inner{position:relative;z-index:2;max-width:900px}
.hero-full .htitle{font-size:clamp(56px,13vw,150px);font-weight:300;color:#fff;letter-spacing:-.04em;line-height:.9;margin:0;text-shadow:0 8px 40px rgba(0,0,0,.35)}
.hero-full .hsub{margin:26px 0 40px;color:rgba(244,245,246,.9);font-size:clamp(11px,2.4vw,17px);letter-spacing:.5em;text-transform:uppercase;font-weight:500;padding-left:.5em}
.btn-hero{background:#fff;color:#1b1e23;border:none;border-radius:999px;padding:18px 46px;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 16px 40px rgba(0,0,0,.28);transition:.15s}
.btn-hero:hover{transform:translateY(-2px);box-shadow:0 22px 48px rgba(0,0,0,.34)}
.hero-full .foot{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:12px;z-index:2;padding:0 24px}

/* Pantalla "gracias" minimalista */
.hero{text-align:center;padding:20px 0 0}
.hero h2{font-size:clamp(34px,7vw,52px);margin:0 0 10px;letter-spacing:-.03em;color:#1b1e23;font-weight:300}
.hero p{color:#868d95;font-size:16px;max-width:460px;margin:0 auto 32px;line-height:1.6}
.check-ic{width:88px;height:88px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 26px;border:1px solid var(--brand-line)}

/* ============================================================
   ADMIN MINIMALISTA (config + PIN)
   ============================================================ */
.adm-head{max-width:720px;margin:0 auto 6px}
.adm-head h2{font-size:30px;font-weight:300;letter-spacing:-.02em;color:#1b1e23;margin:0 0 4px}
.adm-head p{color:#868d95;font-size:14px;margin:0 0 24px}
.card + .card{margin-top:20px}
.card .ctag{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#9aa1a9;margin:0 0 16px}
.mstat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:720px;margin:0 auto 20px}
.mstat{background:#fff;border:1px solid #e6e9ed;border-radius:18px;padding:22px;text-align:center;box-shadow:0 10px 30px rgba(27,30,35,.05)}
.mstat b{display:block;font-size:34px;font-weight:300;color:#1b1e23;line-height:1}
.mstat span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#9aa1a9;margin-top:6px;display:block}
.mtbl{width:100%;border-collapse:collapse;margin-bottom:14px}
.mtbl th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;text-align:left;padding:6px 8px;border-bottom:1px solid #e6e9ed;color:#9aa1a9;font-weight:600}
.mtbl td{padding:6px 6px}
.mtbl input{width:100%;border:1px solid #e0e4e9;border-radius:10px;padding:10px 10px;font-family:inherit;background:#f7f8fa;color:#1b1e23}
.mtbl input:focus{outline:none;border-color:var(--brand);background:#fff}
.mtbl input.num{text-align:center}
.mtbl .del{background:#fff;color:#d64545;border:1px solid #e6d0d0;border-radius:10px;font-weight:700;width:38px;height:38px;font-size:17px;transition:.12s}
.mtbl .del:hover{background:#fbeaea;border-color:#e5b8b8}
.btn-sm{border:none;border-radius:999px;padding:12px 22px;font-weight:600;font-size:14px;transition:.15s}
.btn-dark{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(140,29,64,.22)}
.btn-dark:hover{background:var(--brand-strong)}
.btn-outline{background:#fff;color:#5a6067;border:1px solid #e0e4e9}
.btn-outline:hover{border-color:#bfc5cc}
.btn-danger{background:#fff;color:#d64545;border:1px solid #e6d0d0}
.btn-danger:hover{background:#fbeaea;border-color:#e5b8b8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.back{display:inline-block;margin-top:6px;color:#63696f;font-weight:600;text-decoration:none;cursor:pointer;font-size:14px}
.back:hover{color:var(--brand)}
.mini-note{font-size:12.5px;color:#868d95;margin:0 0 14px;line-height:1.5}

/* Pin pad minimalista */
.pinpad{max-width:300px;margin:8vh auto 0}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:20px 0}
.pin-dots i{width:14px;height:14px;border:2px solid #d3a9b7;border-radius:50%;transition:.15s}
.pin-dots i.f{background:var(--brand);border-color:var(--brand)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keypad button{background:#fff;border:1px solid #e6e9ed;border-radius:16px;font-weight:500;font-size:22px;padding:16px;font-family:inherit;color:#1b1e23;transition:.12s;box-shadow:0 4px 12px rgba(27,30,35,.05)}
.keypad button:hover{border-color:#d3a9b7}
.keypad button:active{transform:scale(.97)}

/* ============================================================
   ESTILO BRUTALISM  (SOLO la ruleta)
   ============================================================ */
.brutal{
  position:relative;
  background:#e11b22;color:#111;min-height:100vh;
  font-family:"Courier New",ui-monospace,monospace;
  padding:170px 18px 60px;display:flex;flex-direction:column;align-items:center;
}
.brutal .bwrap{width:100%;max-width:780px}
.brutal h2{
  font-size:38px;font-weight:900;text-transform:uppercase;letter-spacing:-1px;margin:6px 0 2px;line-height:.95;
  -webkit-text-stroke:1px #111;
}
.brutal .sub{font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:2px;margin:0 0 20px}
/* Mismo tamaño y posición que el logo del home (.brand-logo) */
.brutal-logo{position:absolute;top:22px;left:26px;z-index:2;display:block;height:128px;width:auto;max-width:min(440px,82vw);object-fit:contain;filter:drop-shadow(0 4px 18px rgba(0,0,0,.35))}
.brutal .panel{background:#fff;border:4px solid #111;box-shadow:8px 8px 0 #111;padding:18px;margin-bottom:18px}
.brutal .panel.red{background:#ff5252;color:#fff}
.brutal .panel.blue{background:#2962ff;color:#fff}

.wheel-stage{position:relative;width:min(560px,100%);aspect-ratio:1/1;margin:8px auto 6px}
.wheel-stage svg{display:block;width:100%;height:100%;filter:drop-shadow(6px 6px 0 #111)}
#wheelGroup{transform-origin:50% 50%;transition:none}
.pointer{
  position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:5;
  width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:52px solid #111;
}
.hub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
  width:96px;height:96px;border-radius:50%;background:#111;border:6px solid #fff;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;text-align:center;
}
.bbtn{
  display:block;width:100%;background:#111;color:#fff;border:4px solid #111;
  font-family:inherit;font-weight:900;text-transform:uppercase;font-size:24px;letter-spacing:2px;
  padding:20px;box-shadow:6px 6px 0 #6e1732;transition:.06s;
}
.bbtn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #6e1732}
.bbtn:disabled{opacity:.45;box-shadow:none}
.bbtn.alt{background:#fff;color:#111}
.bbtn.small{font-size:14px;padding:12px}

.result{
  text-align:center;background:#111;color:#fff;border:4px solid #111;padding:24px;margin:16px 0;
  box-shadow:8px 8px 0 #6e1732;
}
.result .lbl{font-size:13px;letter-spacing:3px;font-weight:700;text-transform:uppercase;opacity:.85}
.result .prize{font-size:30px;font-weight:900;text-transform:uppercase;margin:6px 0 0;line-height:1;-webkit-text-stroke:.5px #fff}
.result.nolose{box-shadow:8px 8px 0 #111}
.brutal a.back{display:inline-block;margin-top:6px;color:#111;font-weight:900;text-decoration:underline;cursor:pointer}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1b1e23;color:#fff;font-weight:600;padding:12px 22px;z-index:80;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;max-width:calc(100vw - 32px);text-align:center}

/* ============================================================
   RESPONSIVE — celulares, tablets y pantallas grandes
   El diseño ya usa max-width + clamp; aquí ajustamos densidad,
   tipografía y elementos que en móvil necesitan comprimirse.
   ============================================================ */

/* Tabla de premios (admin): en móvil hace scroll horizontal
   en vez de romper el layout. */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;border-radius:12px}
.tbl-scroll .mtbl{min-width:560px;margin-bottom:0}

/* TABLETS */
@media(max-width:820px){
  .min{padding:48px 18px 100px}
  .card{padding:30px 24px}
}

/* CELULARES */
@media(max-width:560px){
  .min{padding:30px 14px 88px}
  .card{padding:22px 16px;border-radius:18px}
  .q{font-size:20px}
  .q.sm{font-size:16px;margin-top:26px}
  .hint{font-size:13px}
  .step-tag{font-size:10px}
  .adm-head h2{font-size:24px}
  .mstat{padding:18px}
  .mstat b{font-size:28px}
  .mstat-grid{gap:10px}
  .scale{gap:6px}
  .scale button{min-width:40px;height:44px;font-size:14px;padding:0 4px}
  .btn{padding:14px 18px;font-size:14px}
  .opt-row{padding:13px 13px;gap:12px}
  .opt-row span{font-size:14px}
  .emp-block{padding:14px}
  .brand-logo{height:72px;top:16px;left:16px}
  .hero-full{padding:28px 20px}
  .hero-full .hsub{letter-spacing:.32em}
  .btn-hero{padding:16px 32px}
  .row2{grid-template-columns:1fr}
  .brutal{padding:100px 12px 48px}
  .brutal-logo{height:72px;top:16px;left:16px}
  .brutal h2{font-size:30px}
  .brutal .sub{letter-spacing:1.4px}
  .bbtn{font-size:20px;padding:16px}
  .result{padding:18px}
  .result .prize{font-size:24px}
  .cog{top:12px;right:12px}
  .keypad button{padding:14px;font-size:20px}
}

/* CELULARES MUY ANGOSTOS */
@media(max-width:380px){
  .card{padding:18px 13px}
  .q{font-size:18px}
  .scale button{min-width:36px;height:42px;font-size:13px}
  .hub{width:78px;height:78px;font-size:13px}
}

/* ÁREAS SEGURAS (notch / barra inferior de iPhone) */
.cog{top:calc(16px + env(safe-area-inset-top))}
.hero-full .foot{padding-bottom:calc(22px + env(safe-area-inset-bottom))}

/* LANDSCAPE de poca altura: evita que el hero se recorte */
@media(max-height:520px) and (orientation:landscape){
  .hero-full{position:relative;min-height:100vh}
  .hero-full .htitle{font-size:clamp(40px,10vw,90px)}
  .hero-full .hsub{margin:14px 0 24px}
}

/* PANTALLAS GRANDES: la ruleta no crece infinitamente */
@media(min-width:1100px){
  .wheel-stage{width:560px}
}
</style>
</head>
<body>
<div id="root" class="app"></div>
<button class="cog" id="cogBtn" title="Configuración">⚙</button>
<div id="toast"></div>

<script>
"use strict";
/* ================================================================
   EXPO PYME · Encuesta de satisfacción + Ruleta (offline)
   - Encuesta y configuración: estilo minimalista/corporativo.
   - Ruleta: estilo brutalism (único lugar donde se conserva).
   - La ruleta entrega un premio real (cupón de estacionamiento); el resto de
     segmentos son de consolación (sin premio), como una ruleta de casino.
   - Guarda histórico en el navegador y exporta a Excel con el
     MISMO layout que "Encuesta de satisfacción Expo PyME.xlsx"
     (49 columnas, encabezado de 2 filas, datos desde la fila 3).
   - El premio ganado se guarda en la columna custom_1.
   ================================================================ */

/* ----------------------------------------------------------------
   1) CONFIGURACIÓN EDITABLE  (opciones de la encuesta)
   ---------------------------------------------------------------- */
var EMPRESAS = ["ALLIAX","CEMEX","COFLEX","CUPRUM","FINSA","INTERNATIONAL",
  "KANDELIUM","LAMOSA","MAGNEKON","RAGASA","SIGMA","STANLEY BLACK & DECKER",
  "TECONNEX","TERNIUM","VIAKABLE","VITRO","YOMP"];

var OPC_GUSTO_MAS = ["Sistema de citas","Lugar e instalaciones","Atención del personal",
  "Organización del evento","Ponentes y expositores","Networking / contactos"];
var OPC_GUSTO_MENOS = ["Espacio y Capacidad","Pocas CITAS o contactos","Horario del evento",
  "Registro del evento","Organización"];
var OPC_PERFILES = ["Totalmente adecuados","Bien adecuados","Medianamente adecuados",
  "Poco adecuados","Nada adecuados"];

var BENEFICIOS = [
  {k:"contactos",   t:"Acceso a contactos que no obtendría por otra parte"},
  {k:"experiencia", t:"Experiencia"},
  {k:"habilidades", t:"Habilidades empresariales"},
  {k:"informacion", t:"Información sobre el mercado y competidores"},
  {k:"ideas",       t:"Ideas de innovación"},
  {k:"crecimiento", t:"Crecimiento para mi empresa"}
];

/* La ruleta entrega UN premio real (cupón de estacionamiento) y el resto
   son segmentos de consolación (sin premio), como una ruleta de casino.
   label = texto corto que se dibuja en la ruleta (sin abreviar).
   name  = nombre completo que se muestra en el resultado.
   Pesos suman 100 -> estacionamiento = 15%. */
var DEFAULT_PRIZES = [
  {name:"Cupón de Estacionamiento", label:"¡PREMIO!", weight:15,  stock:99999, isPrize:true },
  {name:"Gracias por participar",   label:"¡CASI!",   weight:10,  stock:null,   isPrize:false},
  {name:"Vuelve a intentarlo",      label:"¡VUELVE!", weight:10,  stock:null,   isPrize:false},
  {name:"Mejor suerte",             label:"SUERTE",   weight:8,   stock:null,   isPrize:false},
  {name:"Sigue participando",       label:"GRACIAS",  weight:8,   stock:null,   isPrize:false},
  {name:"Sin premio esta vez",      label:"CASI",     weight:8,   stock:null,   isPrize:false},

/* ---- IndexedDB: respaldo durable + recuperación ---- */
var IDB_NAME="expopyme_db", IDB_STORE="kv", _idbP=null;
function idbOpen(){
  if(_idbP) return _idbP;
  _idbP=new Promise(function(res,rej){
    try{
      if(!window.indexedDB){return rej(new Error("no-idb"));}
      var rq=indexedDB.open(IDB_NAME,1);
      rq.onupgradeneeded=function(){try{rq.result.createObjectStore(IDB_STORE);}catch(e){}};
      rq.onsuccess=function(){res(rq.result);};
      rq.onerror=function(){rej(rq.error);};
    }catch(e){rej(e);}
  });
  return _idbP;
}
function idbSet(key,val){
  return idbOpen().then(function(db){return new Promise(function(res,rej){
    try{var tx=db.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).put(val,key);
      tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};}catch(e){rej(e);}
  });}).catch(function(){});
}
function idbGet(key){
  return idbOpen().then(function(db){return new Promise(function(res,rej){
    try{var tx=db.transaction(IDB_STORE,"readonly");var rq=tx.objectStore(IDB_STORE).get(key);
      rq.onsuccess=function(){res(rq.result);};rq.onerror=function(){rej(rq.error);};}catch(e){rej(e);}
  });}).catch(function(){return null;});
}
/* Al arrancar: pide almacenamiento persistente y recupera lo que
   pudiera estar solo en IndexedDB (p.ej. si se limpió localStorage). */
function initPersistence(){
  try{ if(navigator.storage&&navigator.storage.persist){navigator.storage.persist();} }catch(e){}
  idbGet(LS_HIST).then(function(idbHist){
    if(!idbHist||!idbHist.length) return;
    var ls=loadHist(), seen={};
    ls.forEach(function(e){if(e&&e.respondentId)seen[e.respondentId]=true;});
    var merged=ls.slice(), added=0;
    idbHist.forEach(function(e){if(e&&e.respondentId&&!seen[e.respondentId]){merged.push(e);seen[e.respondentId]=true;added++;}});
    if(added>0){ localStorage.setItem(LS_HIST,JSON.stringify(merged)); toast("Se recuperaron "+added+" respuesta(s) del respaldo"); }
  });
  idbGet(LS_CFG).then(function(c){
    if(c&&c.prizes&&!localStorage.getItem(LS_CFG)){ localStorage.setItem(LS_CFG,JSON.stringify(c)); CFG=loadCfg(); }
  });
}

/* ----------------------------------------------------------------
   2b) SINCRONIZACIÓN CON EL SERVIDOR (modo red local, sin internet)
   Cuando la página se sirve desde la laptop (http://IP:puerto), cada
   respuesta se ENVÍA al servidor para centralizarla en su base de datos.
   Si la página se abre como archivo (file://) funciona como kiosco
   offline de siempre (solo guarda en este dispositivo).
   Es "offline-first": primero guarda local, luego intenta enviar; si el
   WiFi falla, la respuesta queda en cola y se reintenta sola.
   ---------------------------------------------------------------- */
var SYNC_ON = (location.protocol==="http:"||location.protocol==="https:");
var SERVER_OK = false;   // se confirma con /api/health. false = modo kiosco (solo este dispositivo)
var SYNC_URL = "/api/respuesta";

function loadQueue(){try{return JSON.parse(localStorage.getItem(LS_QUEUE))||[];}catch(e){return [];}}
function saveQueue(q){try{localStorage.setItem(LS_QUEUE,JSON.stringify(q));}catch(e){}}
function queueEntry(entry){var q=loadQueue();q.push(entry);saveQueue(q);}

/* Envía UNA respuesta al servidor. Devuelve una promesa que resuelve true/false. */
function postEntry(entry){
  if(!SYNC_ON) return Promise.resolve(false);
  return fetch(SYNC_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(entry)
  }).then(function(r){return r.ok;}).catch(function(){return false;});
}

/* Intenta vaciar la cola de pendientes (respuestas que no se pudieron enviar). */
var _flushing=false;
function flushQueue(){
  if(!SERVER_OK||_flushing) return;
  var q=loadQueue();
  if(!q.length) return;
  _flushing=true;
  var i=0, remaining=[];
  (function next(){
    if(i>=q.length){ saveQueue(remaining); _flushing=false; return; }
    var entry=q[i++];
    postEntry(entry).then(function(ok){
      if(!ok) remaining.push(entry);   // sigue pendiente
      next();
    });
  })();
}

/* Guarda la respuesta hacia el servidor con respaldo en cola. */
function syncEntry(entry){
  if(!SERVER_OK) return;              // sin servidor: modo kiosco (queda en este dispositivo)
  postEntry(entry).then(function(ok){
    if(!ok){ queueEntry(entry); }     // falló → a la cola para reintentar
    else{ flushQueue(); }             // ok → aprovecha para vaciar pendientes
  });
}

  else if(id==="rol")    body=viewRol();

      '<button class="btn btn-primary" id="nextBtn">'+(lastReal?"Finalizar y girar 🎡":"Continuar")+'</button>'+

      '<div class="progress"><span style="width:'+pct+'%"></span></div>'+
      '<div class="card">'+body+nav+'</div>'+

  show(n,true);
  wireSurvey(n,id);

  var back=n.querySelector("#backBtn"); if(back) back.onclick=function(){stepIndex--;renderSurvey();};
  n.querySelector("#nextBtn").onclick=function(){
    if(!validateStep(id)) return;
    if(lastReal){ renderRoulette(); return; }
    stepIndex++; renderSurvey();
  };
}

function validateStep(id){
  if(id==="contacto"){
    if(!A.nombre||!String(A.nombre).trim()){toast("Escribe tu nombre para continuar");return false;}
    if(!A.correo||!String(A.correo).trim()){toast("Escribe tu correo para continuar");return false;}
    if(!/^\S+@\S+\.\S+$/.test(String(A.correo).trim())){toast("Escribe un correo válido");return false;}
    return true;
  }
  if(id==="rol" && !A.rol){toast("Selecciona tu rol para continuar");return false;}
  return true; // el resto es opcional para agilizar el kiosco
}

      de consolación sin premio, estilo ruleta de casino.
   ================================================================ */
function availablePrizes(){return CFG.prizes.filter(function(p){return (p.stock===null||p.stock>0)&&(parseFloat(p.weight)||0)>0;});}

function pickWeighted(list){
  var total=list.reduce(function(s,p){return s+(parseFloat(p.weight)||0);},0);
  var r=Math.random()*total, acc=0;
  for(var i=0;i<list.length;i++){acc+=(parseFloat(list[i].weight)||0);if(r<=acc)return list[i];}
  return list[list.length-1];
}

/* Segmentos visuales de la ruleta.
   Con un único premio, se dibujan varias porciones decorativas
   para que la rueda se vea completa y gire bien. */
function wheelSegments(prizes){
  if(prizes.length>1) return prizes.map(function(p){return {name:p.label||p.name};});
  var labels=["PREMIOS","GRACIAS","PREMIOS","GRACIAS","PREMIOS","GRACIAS","PREMIOS","GRACIAS"];
  return labels.map(function(l){return {name:l};});
}

function renderRoulette(){
  clearToast();   // evita que un aviso previo (p.ej. "Selecciona tu rol") se quede pegado
  document.body.style.background="#f7d417";
  var segs=wheelSegments(CFG.prizes);
  var n=el(
    '<div class="brutal"><div class="bwrap">'+
      '<img class="brutal-logo" src="img/Logo Expo PyME 2026_white.png" alt="Expo PyME 2026">'+
      '<h2>¡GIRA<br>LA RULETA!</h2>'+
      '<p class="sub">'+esc(CFG.eventTitle)+' · Premio</p>'+
      '<div class="panel" style="padding:10px">'+
        '<div class="wheel-stage"><div class="pointer"></div>'+wheelSVG(segs)+'<div class="hub">GIRA</div></div>'+
      '</div>'+
      '<button class="bbtn" id="spinBtn">GIRAR</button>'+
      '<div id="spinResult"></div>'+
    '</div></div>');
  show(n,false);
  var group=n.querySelector("#wheelGroup");
  var btn=n.querySelector("#spinBtn");
  var res=n.querySelector("#spinResult");
  var totalRot=0, isSpinning=false;

  btn.onclick=function(){
    // 1) Bloqueo por estado + premios disponibles
    if(isSpinning) return;
    var avail=availablePrizes();
    if(!avail.length){toast("No hay premios configurados");return;}
    isSpinning=true; btn.disabled=true; res.innerHTML="";

    // 2) Ganador calculado AHORA, ANTES de animar (RNG ponderado)
    var winner=pickWeighted(avail);

    // 3) Ángulo exacto del segmento ganador (puntero arriba = centro de rebanada)
    var N=segs.length, seg=360/N;
    var landIdx = (CFG.prizes.length>1) ? CFG.prizes.indexOf(winner) : Math.floor(Math.random()*N);
    if(landIdx<0) landIdx=0;
    var center=landIdx*seg+seg/2;
    var jitter=(Math.random()-0.5)*seg*0.6;
    var target=(360-center)-jitter;

    // 4) Ángulo final = ángulo del premio + 5 a 8 vueltas completas de 360°
    var extra=360*(5+Math.floor(Math.random()*4));
    var phase=(((target-(totalRot%360))%360)+360)%360;
    var from=totalRot, to=totalRot+extra+phase;
    totalRot=to;

    // 5) Desaceleración gradual (Quartic Ease-Out) en 4-6 s
    var dur=4000+Math.random()*2000;
    animateSpin(group,from,to,dur,function(){
      isSpinning=false;
      wonPrize=winner;
      showSpinResult(res,winner); // onSpinComplete: animación terminó al 100%
    });
  };
}

function quarticEaseOut(t){return 1-Math.pow(1-t,4);}

function animateSpin(group,from,to,dur,onComplete){
  var t0=performance.now();
  (function frame(now){
    var p=Math.min(1,(now-t0)/dur);
    var e=quarticEaseOut(p);
    group.style.transform="rotate("+(from+(to-from)*e)+"deg)";
    if(p<1){requestAnimationFrame(frame);}
    else if(onComplete){onComplete();}
  })(t0);
}

function wheelSVG(segs){
  var N=segs.length, seg=360/N, cx=200, cy=200, r=196;
  var paths="", labels="";
  for(var i=0;i<N;i++){
    var a0=(i*seg-90)*Math.PI/180, a1=((i+1)*seg-90)*Math.PI/180;
    var x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    var x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    var large=seg>180?1:0;
    var col=WHEEL_COLORS[i%WHEEL_COLORS.length];
    paths+='<path d="M'+cx+','+cy+' L'+x0.toFixed(1)+','+y0.toFixed(1)+' A'+r+','+r+' 0 '+large+',1 '+x1.toFixed(1)+','+y1.toFixed(1)+' Z" fill="'+col+'" stroke="#111" stroke-width="3"/>';
    var light=isDark(col);
    var nm=segs[i].name.toUpperCase(); if(nm.length>18) nm=nm.slice(0,17)+"…";
    /* Texto RADIAL como PALABRA COMPLETA (una sola línea, se lee de centro
       hacia afuera). En la mitad izquierda giramos 180° para que no quede
       de cabeza y siempre se lea derecha. */
    var rInner=48, rRim=190;
    var midDeg=i*seg+seg/2-90;                 // bisector: 0°=este, horario
    var rMid=(rInner+rRim)/2;                   // radio donde centramos la palabra
    var tx=cx+rMid*Math.cos(midDeg*Math.PI/180);
    var ty=cy+rMid*Math.sin(midDeg*Math.PI/180);
    var flip=(Math.cos(midDeg*Math.PI/180)<0)?180:0;  // mitad izquierda → voltea
    var fs=15;
    var avail=rRim-rInner-14;                    // largo radial disponible
    var estW=nm.length*fs*0.60;                  // ancho estimado del texto
    var lenAttr=estW>avail?' textLength="'+avail.toFixed(0)+'" lengthAdjust="spacingAndGlyphs"':'';
    labels+='<text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" fill="'+(light?"#fff":"#111")+'"'+
            ' font-size="'+fs+'" font-weight="800" font-family="Arial Narrow, Arial, sans-serif"'+
            ' letter-spacing="1" text-anchor="middle" dominant-baseline="central"'+lenAttr+
            ' transform="rotate('+(midDeg+flip).toFixed(1)+','+tx.toFixed(1)+','+ty.toFixed(1)+')">'+esc(nm)+'</text>';
  }
  return '<svg viewBox="0 0 400 400"><g id="wheelGroup"><circle cx="200" cy="200" r="198" fill="#111"/>'+paths+labels+'</g></svg>';
}

function commitResponse(winner){
  var now=new Date();
  var entry=Object.assign({}, A);
  entry.emp=A.emp;
  entry.premio = winner.isPrize ? winner.name : "";     // custom_1
  entry.premioLanded = winner.name;                     // referencia interna
  entry.respondentId = String(Date.now())+String(Math.floor(Math.random()*900+100));
  entry.dateCreated = now.toISOString();
  entry.dateModified = now.toISOString();
  // descontar stock del premio real
  if(winner.isPrize && winner.stock!==null && winner.stock>0){
    var idx=CFG.prizes.indexOf(winner);
    if(idx>=0){CFG.prizes[idx].stock=Math.max(0,CFG.prizes[idx].stock-1);saveCfg(CFG);}
  }
  var h=loadHist(); h.push(entry); saveHist(h);
  syncEntry(entry);            // enviar al servidor (si está en red local)
  clearDraft();
  // Autoexportar respaldo cada N respuestas (configurable en Ajustes)
  var every=parseInt(CFG.autoExportEvery,10)||0;
  if(every>0 && h.length % every===0){ try{ exportExcel(); toast("Respaldo automático exportado ("+h.length+" respuestas)"); }catch(e){} }
  screenThanks();
}

function rowFromEntry(e){
  return [
    e.respondentId||"", "", D(e.dateCreated), D(e.dateModified), "", "", "", "", e.premio||"",

function num(v){ if(v===""||v==null) return ""; var n=parseFloat(v); return isNaN(n)?v:{__num:n}; }
function D(iso){ if(!iso) return ""; return {__date:new Date(iso)}; }

function exportExcel(){
  var hist=loadHist();
  var rows=hist.map(rowFromEntry);
  var bytes=buildXlsx([HEADER1,HEADER2].concat(rows));
  var blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var fn="Encuesta de satisfacción Expo PyME "+stamp()+".xlsx";
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=fn;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  toast(hist.length+" respuesta(s) exportadas");
}
function stamp(){var d=new Date(),p=function(x){return(x<10?"0":"")+x;};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes());}

/* ---------- Generador XLSX mínimo (ZIP "stored" + XML) ---------- */
function colLetter(n){var s="";n++;while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
function xmlEsc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function excelSerial(dt){
  var base=Date.UTC(1899,11,30);
  var local=Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate(),dt.getHours(),dt.getMinutes(),dt.getSeconds());
  return (local-base)/86400000;
}
function sheetXml(matrix){
  var lastCol=colLetter(matrix[0].length-1), lastRow=matrix.length;
  var out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:'+lastCol+lastRow+'"/><sheetData>';
  for(var r=0;r<matrix.length;r++){
    out+='<row r="'+(r+1)+'">';
    var row=matrix[r];
    for(var c=0;c<row.length;c++){
      var v=row[c], ref=colLetter(c)+(r+1);
      if(v===""||v==null) continue;
      if(v&&v.__num!=null){ out+='<c r="'+ref+'"><v>'+v.__num+'</v></c>'; }
      else if(v&&v.__date!=null){ out+='<c r="'+ref+'" s="1"><v>'+excelSerial(v.__date)+'</v></c>'; }
      else{ out+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>'; }
    }
    out+='</row>';
  }
  out+='</sheetData></worksheet>';
  return out;
}

/* ZIP sin compresión (stored) + CRC32 */
var CRC_TABLE=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(bytes){var c=0xFFFFFFFF;for(var i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function strBytes(s){return new TextEncoder().encode(s);}
function zipStore(files){
  var chunks=[], central=[], offset=0;
  function u16(n){return [n&0xFF,(n>>8)&0xFF];}
  function u32(n){return [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF];}
  files.forEach(function(f){
    var nameB=strBytes(f.name), dataB=strBytes(f.data), crc=crc32(dataB);
    var local=[].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(dataB.length),u32(dataB.length),u16(nameB.length),u16(0));
    chunks.push(new Uint8Array(local)); chunks.push(nameB); chunks.push(dataB);
    var cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(dataB.length),u32(dataB.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    central.push(new Uint8Array(cen)); central.push(nameB);
    offset+=local.length+nameB.length+dataB.length;
  });
  var cstart=offset, csize=0;
  central.forEach(function(a){csize+=a.length;});
  var end=[].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(csize),u32(cstart),u16(0));
  var all=chunks.concat(central,[new Uint8Array(end)]);
  var total=all.reduce(function(s,a){return s+a.length;},0);
  var out=new Uint8Array(total), pos=0;
  all.forEach(function(a){out.set(a,pos);pos+=a.length;});
  return out;
}
